[alembic]
script_location = migrations
# The URL comes from DCS_DATABASE_URL (see migrations/env.py); this default is only a fallback.
sqlalchemy.url = sqlite:///./digital_crime_scene.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
